<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style/style.css">
  <title>Rock, paper, scissors</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">
        <span class="rock">Rock</span>

        <span class="paper">Paper</span>
        
        <span class="scissors">Scissors</span>
      </h1>

      <p class="description">Play against the computer and see who wins!</p>
    </header>

    <main class="game-field">
      <div class="scoreboard">
        <div class="score">
          <p class="player-score">Your score</p>

          <p class="player-score-counter">0</p>
        </div>

        <div class="score">
          <p class="computer-score">Computer score</p>

          <p class="computer-score-counter">0</p>
        </div>
      </div>

      <div class="player-choice">
        <p class="action-description">Choose your move</p>

        <div class="choice-variants">
          <button class="rock-btn">
            <img src="./assets/rock-svgrepo-com.svg" alt="rock">
            <span>Rock</span>
          </button>

          <button class="paper-btn">
            <img src="./assets/scroll.png" alt="paper">
            <span>Paper</span>
          </button>

          <button class="scissors-btn">
            <img src="./assets/scissors-svgrepo-com.svg" alt="scissors">
            <span>Scissors</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="game-result">Make your move to start the game</div>

      <button class="reset-btn">Reset game</button>
    </footer>
  </div>
  
  <script src="/script.js"></script>
</body>
</html>
